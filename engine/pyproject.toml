[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desnworld"
version = "0.1.0"
description = "DESNWORLD - a general-purpose AI scenario exploration engine (possibilities, not predictions)"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "DESNWORLD contributors" }]
dependencies = [
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
desnworld = "desnworld.cli:main"

[tool.setuptools.packages.find]
include = ["desnworld*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
